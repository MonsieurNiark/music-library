name: Codex manual review

on:
  workflow_dispatch:
    inputs:
      prompt-file:
        description: Prompt file to run
        required: true
        default: .github/codex/prompts/review.md

jobs:
  codex:
    name: Run Codex
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ inputs.prompt-file }}
          output-file: codex-output.md

      - name: Upload Codex output
        uses: actions/upload-artifact@v5
        with:
          name: codex-output
          path: codex-output.md
